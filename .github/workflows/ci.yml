name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. No job in this workflow needs more, and none reads repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
  TRIVY_VERSION: "0.76.1"
  TRIVY_ARM64_SHA256: "e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f"

jobs:
  backend:
    name: Backend (format, lint, types, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install gitleaks (needed by scanner tests)
        working-directory: .
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan commit history and working tree
        run: |
          gitleaks git --config .gitleaks.toml --redact --no-banner .
          gitleaks dir --config .gitleaks.toml --redact --no-banner .

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

  workflows:
    name: Workflow security lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: actionlint
      - name: zizmor (offline audits)
        run: uv run --project apps/api --frozen zizmor --offline --min-severity low .github/workflows

  dockerfile:
    name: Dockerfile lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
      - run: '"$RUNNER_TEMP/hadolint" apps/api/Dockerfile'

  image:
    name: ARM64 image (build, scan, compose smoke test)
    # Native GitHub-hosted arm64 runner: no emulation. If the label is unavailable the job
    # never starts and the required check stays pending, so verify it on the first run.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          echo "${TRIVY_ARM64_SHA256}  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan Dockerfile and Compose configuration
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .
      - name: Build image
        run: docker build --tag alvo-api:ci apps/api
      - name: Confirm architecture
        run: test "$(docker image inspect alvo-api:ci --format '{{.Architecture}}')" = "arm64"
      - name: Scan image for known vulnerabilities
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 alvo-api:ci
      - name: Compose smoke test (non-production, throwaway secrets)
        run: |
          set -euo pipefail
          python3 apps/api/scripts/make_dev_secrets.py
          docker compose up --build -d --wait --wait-timeout 180
          docker compose run --rm api alembic upgrade head
          curl -fsS http://127.0.0.1:8000/health/ready
          # The database must not be published on the host.
          test -z "$(docker compose port db 5432 2>/dev/null)"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 50
      - name: Tear down
        if: always()
        run: docker compose down -v
