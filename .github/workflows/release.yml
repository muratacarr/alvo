name: Release

# Builds the production images and publishes them by digest. Started by hand, from main only.
# The `production` environment carries a required reviewer (repository settings), so nothing is
# published until the owner approves this run. Deploying is a separate, manual step on the Pi
# (ops/deploy/deploy.sh); nothing here can reach the server.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ARM64 images
    if: github.ref == 'refs/heads/main'
    # Native arm64 runner: the Pi runs arm64, and there is no emulation to trust.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      packages: write # push the images to GitHub Container Registry
      id-token: write # lets the attestation step sign with this run's identity (no stored key)
      attestations: write # store the provenance attestations next to the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/api
          platforms: linux/arm64
          push: true
          tags: ghcr.io/muratacarr/alvo-api:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Build and push the web image
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/muratacarr/alvo-web:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Attest the API image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/muratacarr/alvo-api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Attest the web image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/muratacarr/alvo-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Write the release manifest
        env:
          COMMIT: ${{ github.sha }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg commit "$COMMIT" --arg api "$API_DIGEST" --arg web "$WEB_DIGEST" \
            '{schema: 1, commit: $commit, api_digest: $api, web_digest: $web}' > release-manifest.json
          {
            echo "### Release manifest"
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
