[project]
name = "alvo"
version = "0.1.0"
description = "Alvo API: goal-based learning and practice platform"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "pip-audit>=2.10.1",
    "zizmor>=1.31.1",
    "testcontainers[postgres]>=4.15.0",
    "httpx2>=2.16.0",
    "import-linter>=2.15",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.isort]
# apps/api/alembic/ is our migrations folder, not the third-party package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "alvo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Business modules do not depend on each other except along the allowed edges"
type = "forbidden"
source_modules = ["alvo.identity"]
forbidden_modules = ["alvo.projects", "alvo.content", "alvo.entitlements"]

[[tool.importlinter.contracts]]
name = "projects only depends on identity and shared"
type = "forbidden"
source_modules = ["alvo.projects"]
forbidden_modules = ["alvo.content", "alvo.entitlements"]

[[tool.importlinter.contracts]]
name = "entitlements only depends on identity and shared"
type = "forbidden"
source_modules = ["alvo.entitlements"]
forbidden_modules = ["alvo.projects", "alvo.content"]

[[tool.importlinter.contracts]]
name = "shared never depends on a business module"
type = "forbidden"
source_modules = ["alvo.shared"]
forbidden_modules = ["alvo.identity", "alvo.projects", "alvo.content", "alvo.entitlements"]

[[tool.importlinter.contracts]]
name = "Domain layers are framework-free"
type = "forbidden"
source_modules = [
    "alvo.identity.domain",
    "alvo.projects.domain",
    "alvo.content.domain",
    "alvo.entitlements.domain",
]
forbidden_modules = ["sqlalchemy", "fastapi", "pydantic", "starlette"]
