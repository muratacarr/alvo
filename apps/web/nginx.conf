# Serves the built PWA and forwards /api to the API, so the browser sees ONE origin.
# That is what lets the API check the exact `Origin` header and need no CORS at all.
# Development topology. TLS and HSTS are added at the HTTPS edge (slice 1F).

# --- Rate limiting (ADR 0009) -------------------------------------------------------------
# Behind the Cloudflare Tunnel every connection comes from the cloudflared container, so the
# real client address is read from CF-Connecting-IP. It is trusted ONLY when the connection
# comes from a private (Docker) network, which in production is just the tunnel: nothing is
# published on the host. In development anyone on localhost can set the header; that is harmless.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# General ceiling per client address, and a much stricter one for state-changing auth requests
# (an empty key is not counted, so reads such as /auth/me are only under the general ceiling).
map $request_method $auth_write_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $auth_write_key     zone=auth_write:1m   rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_client_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    limit_conn per_client_conn 30;

    # The same machine-readable body the API uses, so the web app handles both alike.
    error_page 429 = @rate_limited;
    location @rate_limited {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        default_type application/json;
        return 429 '{"error":"rate_limited"}';
    }

    root /usr/share/nginx/html;
    index index.html;

    # Keep the standard types and add the one the PWA manifest needs.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Import files are capped at 2 MiB by the API; this is only a coarse outer bound.
    client_max_body_size 3m;

    # Docker's embedded DNS; re-resolved so an API restart (new IP) does not break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Unsafe sign-in requests get their own strict ceiling (10 per minute, burst 5).
    location /api/v1/auth/ {
        limit_req zone=auth_write burst=5 nodelay;
        limit_req zone=api_general burst=40 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite, never append: the API trusts this header only because we set it here.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        # nginx adds our own copy below; avoid duplicate header lines.
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Interactive API docs exist only when the API runs in development; in production the
    # API itself answers 404, so proxying these paths cannot expose anything.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # Swagger UI loads its script and styles from a CDN and uses inline code.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell and the service worker must be revalidated so updates reach users.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to the shell, which shows its own 404 page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
