# Serves the built PWA and forwards /api to the API, so the browser sees ONE origin.
# That is what lets the API check the exact `Origin` header and need no CORS at all.
# Development topology. TLS and HSTS are added at the HTTPS edge (slice 1F).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Keep the standard types and add the one the PWA manifest needs.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Import files are capped at 2 MiB by the API; this is only a coarse outer bound.
    client_max_body_size 3m;

    # Docker's embedded DNS; re-resolved so an API restart (new IP) does not break the proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
        # nginx adds our own copy below; avoid duplicate header lines.
        proxy_hide_header X-Content-Type-Options;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Interactive API docs exist only when the API runs in development; in production the
    # API itself answers 404, so proxying these paths cannot expose anything.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_hide_header X-Content-Type-Options;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        # Swagger UI loads its script and styles from a CDN and uses inline code.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com https://cdn.jsdelivr.net; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell and the service worker must be revalidated so updates reach users.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|workbox-.*\.js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to the shell, which shows its own 404 page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
