# Included in every location: nginx drops inherited add_header lines as soon as a location
# declares its own, so the headers are kept in one snippet instead of being repeated by hand.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
# Scripts: only our own files, never inline (this is what stops injected JavaScript).
# Styles: Ant Design injects <style> elements and style attributes at runtime (CSS-in-JS),
# so style-src must allow inline styles. Accepted trade-off, see docs/adr/0008.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
