# PRODUCTION stack for the Raspberry Pi. Read docs/ops/production-runbook.md first.
#
# Differences from compose.yaml (development), all enforced by tests:
# - images are pulled by digest (never built on the Pi, never a mutable tag);
# - nothing is published on the host: the only way in is the outbound Cloudflare Tunnel;
# - secrets are root-owned files outside the checkout (/etc/alvo/secrets);
# - the API has no route to the internet (add an egress network only when a feature needs it);
# - no mock login: until a real sign-in method exists, nobody can sign in.
#
#   export ALVO_PUBLIC_ORIGIN=https://alvo.example.com
#   export ALVO_API_DIGEST=sha256:...   ALVO_WEB_DIGEST=sha256:...
#   docker compose -f compose.prod.yaml config -q      # check before starting
name: alvo

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  # Bounded logs: an unbounded log can fill the disk and take the database down with it.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *hardened
    image: postgres:18-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: "999:999"
    environment:
      POSTGRES_USER: alvo_app
      POSTGRES_DB: alvo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      # Keep Docker's data directory on the SSD, not the microSD card.
      - db-data:/var/lib/postgresql
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks:
      - backend
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvo_app -d alvo"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *hardened
    image: ghcr.io/muratacarr/alvo-api@${ALVO_API_DIGEST:?set ALVO_API_DIGEST to the approved sha256 digest}
    user: "10001:10001"
    environment:
      ALVO_ENVIRONMENT: production
      ALVO_PUBLIC_ORIGIN: ${ALVO_PUBLIC_ORIGIN:?set ALVO_PUBLIC_ORIGIN to the https address of the site}
      # No sign-in route exists until a real identity provider is added.
      ALVO_IDENTITY_PROVIDER: none
      # Only our nginx can reach the API and it overwrites X-Forwarded-For (ADR 0009).
      ALVO_TRUST_FORWARDED_FOR: "true"
    secrets:
      - alvo_database_url
      - alvo_session_secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - app
    tmpfs:
      - /tmp
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    <<: *hardened
    image: ghcr.io/muratacarr/alvo-web@${ALVO_WEB_DIGEST:?set ALVO_WEB_DIGEST to the approved sha256 digest}
    user: "101:101"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
      - proxy
    tmpfs:
      - /tmp
    mem_limit: 128m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  cloudflared:
    <<: *hardened
    # Outbound-only tunnel to Cloudflare; the public hostname is configured in the Cloudflare
    # dashboard and points at http://web:8080. Pinned like every other image.
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    user: "65532:65532"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets:
      - tunnel_token
    depends_on:
      web:
        condition: service_healthy
    networks:
      - proxy
    mem_limit: 128m
    pids_limit: 100
    # Unhealthy when the tunnel is not connected, so `docker compose ps` shows it.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # Database and API cannot reach, or be reached from, the internet.
  backend:
    internal: true
  app:
    internal: true
  # Only the web server and the tunnel live here; the tunnel needs outbound access.
  proxy: {}

volumes:
  db-data: {}

secrets:
  db_password:
    file: /etc/alvo/secrets/db_password
  alvo_database_url:
    file: /etc/alvo/secrets/alvo_database_url
  alvo_session_secret:
    file: /etc/alvo/secrets/alvo_session_secret
  tunnel_token:
    file: /etc/alvo/secrets/tunnel_token
